<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Quiz For You</title>
    <style>
        :root {
            --primary-pink: #ff4a75;
            --secondary-pink: #ff7597;
            --bg-dark: #0f0e11;
            --card-bg: #16151a;
            --text-light: #f3f4f6;
            --text-gray: #a0a0ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Background System */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 74, 117, 0.12);
            font-size: 20px;
            animation: floatUp 7s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 35px rgba(255, 74, 117, 0.15);
            text-align: center;
            border: 1px solid #26242c;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Standard Content View Panel */
        .view-panel {
            width: 100%;
            text-align: left;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.4;
            color: #ffffff;
            border-left: 4px solid var(--primary-pink);
            padding-left: 12px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Large Universal Click Target Interface Elements */
        .option-btn {
            background: #1e1d24;
            color: var(--text-light);
            border: 1px solid #2e2c36;
            padding: 18px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.98rem;
            text-align: left;
            width: 100%;
            display: block;
            transition: all 0.2s ease;
        }

        .option-btn:hover, .option-btn:active {
            background: #27252e;
            border-color: var(--secondary-pink);
            transform: translateY(-1px);
        }

        .result-screen {
            text-align: center;
        }

        .sparkle-badge {
            background: rgba(255, 74, 117, 0.1);
            color: var(--secondary-pink);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 74, 117, 0.2);
        }

        .rating-desc {
            color: #e4e4e7;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 15px;
            font-weight: 500;
        }

        .heart-display {
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        .start-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            color: white;
            border: none;
            padding: 18px 24px;
            border-radius: 35px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 74, 117, 0.35);
            margin-top: 10px;
            width: 100%;
            display: block;
            text-align: center;
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="heart-bg" id="heart-bg"></div>

<div class="container" id="app-container">
    
    <!-- MASTER APP GATEWAY VIEW -->
    <div id="view-gateway" class="view-panel" style="text-align: center;">
        <div class="header-icon">💌</div>
        <h1>A Special Quiz For You</h1>
        <p class="subtitle">I created this quick little space to find out how you truly feel about us. Be completely honest!</p>
        <button class="start-btn" id="trigger-app-start">Begin Quiz ✨</button>
    </div>

    <!-- MAIN ACTIVE CORE ENGINE WORKSPACE -->
    <div id="view-core-engine" class="view-panel" style="display: none;">
        <p class="question-text" id="engine-question-target">Loading presentation query content...</p>
        <div class="options-list" id="engine-options-target">
            <!-- Dynamic choice targets render here -->
        </div>
    </div>

    <!-- APPLICATION ENDPOINT ROUTER VIEW -->
    <div id="view-endpoint" class="view-panel result-screen" style="display: none;">
        <div class="sparkle-badge">Quiz Complete ✨</div>
        <div class="heart-display" id="heart-rating">❤️❤️❤️❤️❤️</div>
        <p class="rating-desc" id="rating-desc">Compiling performance output dataset strings...</p>
    </div>

</div>

<script>
    // Comprehensive Quiz Schema Framework Configuration Dataset
    const ROUTER_MANIFEST = [
        {
            question: "When my name pops up on your phone screen, what's your genuine reaction?",
            options: [
                { text: "It immediately brightens my mood and I click it instantly", score: 3 },
                { text: "I smile and reply as soon as I finish what I'm doing", score: 2 },
                { text: "I treat it like any other message or answer later", score: 1 }

        },
        {

                { text: "It's nice, but I'm ready to head home after a bit", score: 1 }
            ]
        },
        {
            question: "When you look toward your future, do you see me somewhere in it?",

                { text: "Absolutely, I want you right by my side", score: 3 },
                { text: "I definitely hope you are a part of it", score: 2 },

            ]
        }
    ];

    let activePointerIndex = 0;

    const nodeGateway = document.getElementById('view-gateway');

    const labelQuestion = document.getElementById('engine-question-target');
    const wrapperOptions = document.getElementById('engine-options-target');

    // Central Controller State Machine Layer
    function transitApplicationState(targetStateCode) {
        if (targetStateCode === 'CORE') {
            nodeGateway.style.display = 'none';
            nodeEndpoint.style.display = 'none';
            nodeCoreEngine.style.display = 'block';
            renderCoreDatasetNode();
        } else if (targetStateCode === 'ENDPOINT') {
            nodeGateway.style.display = 'none';
            nodeCoreEngine.style.display = 'none';
            nodeEndpoint.style.display = 'block';
            evaluateMetricsOutcome();
        }
    }

    // Dynamic Context Engine Generation Subroutine
    function renderCoreDatasetNode() {
        // Clear content workspace area completely
        wrapperOptions.innerHTML = '';
        
        const currentDataRecord = ROUTER_MANIFEST[activePointerIndex];
        labelQuestion.innerText = currentDataRecord.question;

        // Construct nodes directly to prevent injection lag on strict mobile viewports
        currentDataRecord.options.forEach((choiceItem) => {
            const alternativeButton = document.createElement('button');
            alternativeButton.className = 'option-btn';
            alternativeButton.innerText = choiceItem.text;
            
            // Register hardware interface bindings safely
            alternativeButton.addEventListener('click', function(e) {
                e.preventDefault();
