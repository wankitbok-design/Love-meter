<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message From Me To You</title>
    <style>
        :root {
            --primary-pink: #ff4a75;
            --secondary-pink: #ff7597;
            --bg-dark: #0f0e11;
            --card-bg: #16151a;
            --text-light: #f3f4f6;
            --text-gray: #a0a0ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Hearts Background Animation */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 74, 117, 0.15);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(255, 74, 117, 0.15);
            text-align: center;
            border: 1px solid #26242c;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .header-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .question-card {
            display: none;
            animation: slideIn 0.4s ease-out forwards;
        }

        .question-card.active {
            display: block;
        }

        .question-text {
            font-size: 1.25rem;
            margin-bottom: 30px;
            font-weight: 600;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: #1e1d24;
            color: var(--text-light);
            border: 1px solid #2e2c36;
            padding: 16px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background: #27252e;
            border-color: var(--secondary-pink);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 74, 117, 0.1);
        }

        .option-btn::after {
            content: '✨';
            opacity: 0;
            transition: opacity 0.2s;
        }

        .option-btn:hover::after {
            opacity: 1;
        }

        /* Result Layout */
        .result-screen {
            display: none;
            animation: celebrateIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .sparkle-badge {
            background: rgba(255, 74, 117, 0.1);
            color: var(--secondary-pink);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 74, 117, 0.2);
        }

        .rating-desc {
            color: #e4e4e7;
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .heart-display {
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes celebrateIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- Animated background container -->
<div class="heart-bg" id="heart-bg"></div>

<div class="container">
    <div id="quiz-header">
        <div class="header-icon">💌</div>
        <h1>A Special Quiz For You</h1>
        <p class="subtitle">I created this quick little space to find out how you truly feel about us. Be completely honest!</p>
    </div>

    <!-- FIXED: Added missing element where questions load -->
    <div id="quiz-body"></div>

    <!-- Result Screen -->
    <div id="result-screen" class="result-screen">
        <div class="sparkle-badge">Quiz Complete ✨</div>
        <div class="heart-display" id="heart-rating">⭐⭐⭐⭐⭐</div>
        <p class="rating-desc" id="rating-desc">Thank you for opening your heart to me.</p>
    </div>
</div>

<script>
    // Configured questions written directly to HER perspective
    const questions = [
        {
            question: "When my name pops up on your phone screen, what's your genuine reaction?",
            options: [
                { text: "It immediately brightens my mood and I click it instantly", score: 3 },
                { text: "I smile and reply as soon as I finish what I'm doing", score: 2 },
                { text: "I treat it like any other message or answer later", score: 1 }
            ]
        },
        {
            question: "How do you feel when we talk or hang out for hours?",
            options: [
                { text: "Time flies by way too fast, I never want it to end", score: 3 },
                { text: "It's always fun, peaceful, and comfortable", score: 2 },
                { text: "It's nice, but I'm ready to head home after a bit", score: 1 }
            ]
        },
        {
            question: "When you look toward your future, do you see me somewhere in it?",
            options: [
                { text: "Absolutely, I want you right by my side", score: 3 },
                { text: "I definitely hope you are a part of it", score: 2 },
                { text: "I haven't thought that far ahead yet", score: 1 }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let totalScore = 0;

    const quizBody = document.getElementById('quiz-body');
    const quizHeader = document.getElementById('quiz-header');
    const resultScreen = document.getElementById('result-screen');

    // Create background floating hearts
    function createAmbientHearts() {
        const bg = document.getElementById('heart-bg');
        if (!bg) return;
        const heartSymbols = ['❤️', '💖', '✨', '💕'];
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                bg.appendChild(heart);
                
                setInterval(() => {
                    heart.style.left = Math.random() * 100 + 'vw';
                }, 6000);
            }, i * 300);
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        const currentQ = questions[currentQuestionIndex];
        
        let html = `
            <div class="question-card active">
                <p class="question-text">${currentQ.question}</p>
                <div class="options-list">
        `;

        currentQ.options.forEach(option => {
            html += `<button class="option-btn" onclick="handleAnswer(${option.score})"><span>${option.text}</span></button>`;
        });

        html += `</div></div>`;
        quizBody.innerHTML = html;
    }

    function handleAnswer(score) {
        totalScore += score;
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResults() {
        quizHeader.style.display = 'none';
        quizBody.style.display = 'none';
        resultScreen.style.display = 'block';

        const heartRating = document.getElementById('heart-rating');
        const desc = document.getElementById('rating-desc');

        if (totalScore >= 8) {
            heartRating.innerText = "❤️ ❤️ ❤️ ❤️ ❤️";
