<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Love Meter</title>
    <style>
        :root {
            --primary-pink: #ff4a75;
            --secondary-pink: #ff7597;
            --bg-dark: #121214;
            --card-bg: #1c1c1f;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(255, 74, 117, 0.1);
            text-align: center;
            border: 1px solid #2a2a2e;
        }

        h1 {
            color: var(--primary-pink);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .question-card {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .question-card.active {
            display: block;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: #252529;
            color: var(--text-light);
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover {
            background: #2e2e33;
            border-color: var(--secondary-pink);
            transform: translateY(-2px);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #252529;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-pink), var(--secondary-pink));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Results Screen */
        .result-screen {
            display: none;
            animation: scaleUp 0.5s ease forwards;
        }

        .meter-circle {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #252529 60%, transparent 61%);
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid var(--primary-pink);
            box-shadow: 0 0 20px rgba(255, 74, 117, 0.3);
        }

        .percentage {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }

        .rating-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--secondary-pink);
        }

        .rating-desc {
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .restart-btn:hover {
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-header">
        <h1>💞 Love Meter</h1>
        <p class="subtitle">Answer honestly to find out where you stand</p>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
        </div>
    </div>

    <!-- Quiz Wrapper -->
    <div id="quiz-body">
        <!-- Questions will be injected here dynamically by JavaScript -->
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="result-screen">
        <div class="meter-circle">
            <span class="percentage" id="final-score">0%</span>
        </div>
        <h2 class="rating-title" id="rating-title">Analyzing...</h2>
        <p class="rating-desc" id="rating-desc"></p>
        <button class="restart-btn" onclick="restartQuiz()">Try Again</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "How does he react when you text or call him?",
            options: [
                { text: "Replies instantly with long, enthusiastic messages", score: 25 },
                { text: "Takes some time but always gives thoughtful replies", score: 18 },
                { text: "Gives dry, short replies or leaves me on read frequently", score: 5 }
            ]
        },
        {
            question: "Does he remember the little things you mention in passing?",
            options: [
                { text: "Yes! He surprises me by remembering tiny details", score: 25 },
                { text: "Sometimes he forgets, but she genuinely tries", score: 15 },
                { text: "He barely remembers important things I tell her", score: 0 }
            ]
        },
        {
            question: "How does she behave when you are hanging out together?",
            options: [
                { text: "Fully present, leans in, and keeps consistent eye contact", score: 25 },
                { text: "Relaxed and friendly, though he checks his phone occasionally", score: 15 },
                { text: "Distracted, looking around, or seems bored", score: 2 }
            ]
        },
        {
            question: "How does she act when you tell her about a rough day?",
            options: [
                { text: "Drops everything to listen, comfort, or help you", score: 25 },
                { text: "Sends a sweet text checking up on you", score: 15 },
                { text: "Seems indifferent or shifts the topic back to herself", score: 0 }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let totalScore = 0;

    const quizBody = document.getElementById('quiz-body');
    const quizHeader = document.getElementById('quiz-header');
    const resultScreen = document.getElementById('result-screen');
    const progressBar = document.getElementById('progress');

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showResults();
            return;
        }

        // Update progress bar
        const progressPercent = (currentQuestionIndex / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        const currentQ = questions[currentQuestionIndex];
        
        let html = `
            <div class="question-card active">
                <p class="question-text">${currentQ.question}</p>
                <div class="options-list">
        `;

        currentQ.options.forEach(option => {
            html += `<button class="option-btn" onclick="handleAnswer(${option.score})">${option.text}</button>`;
        });

        html += `</div></div>`;
        quizBody.innerHTML = html;
    }

    function handleAnswer(score) {
        totalScore += score;
        currentQuestionIndex++;
        loadQuestion();
    }

    function showResults() {
        quizHeader.style.display = 'none';
        quizBody.style.display = 'none';
        resultScreen.style.display = 'block';
        progressBar.style.width = '100%';

        document.getElementById('final-score').innerText = `${totalScore}%`;

        const title = document.getElementById('rating-title');
        const desc = document.getElementById('rating-desc');

        if (totalScore >= 85) {
            title.innerText = "❤️ Pure Devotion (5/5) ❤️";
            desc.innerText = "He is absolutely head over heels for you! He values your presence, remembers the small details, and truly cares about your happiness. Keep cherishing him!";
        } else if (totalScore >= 60) {
            title.innerText = "💖 Strong Connection (3.5/5) 💖";
            desc.innerText = "There is a very clear spark here! He likes you a lot and puts healthy effort into the relationship. With a little more time, this could grow into something even deeper.";
        } else if (totalScore >= 35) {
            title.innerText = "💛 Mixed Signals (2.5/5) 💛";
            desc.innerText = "He cares about you, but he might be holding back, shy, or unsure of his own feelings right now. Give it some time and observe him actions closely.";
        } else {
            title.innerText = "💔 One-Sided / Distant (1/5) 💔";
            desc.innerText = "The connection seems low right now. he might be distracted by other things in his life, or the feelings might not be reciprocated. It might be time to have an open conversation.";
